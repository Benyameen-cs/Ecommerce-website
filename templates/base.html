<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    {% endblock %}
    {% load static %}
    {% block link %}
    {% endblock %}

    <style>
        /* ADDED THE MESSAGES STYLES */
        
        .success{
                display: flex;
                justify-content: center;
                align-items: center;
                position: fixed;
                border-radius: 8px;
                top: 20px;
                right: 20px;
                z-index: 1000;
                width: auto;
                width: 320px;  
                background-color: #28a745;
                min-height: 50px;
                pointer-events: none;
                animation: slideDown 0.35s ease-out, fadeOutContainer 3.5s ease-out forwards;
        }
        .error{
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 8px;
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 1000;
                width: auto;
                width: 320px;
                background-color: #dc3545;
                min-height: 50px;
                pointer-events: none;
                animation: slideDown 0.35s ease-out, fadeOutContainer 3.5s ease-out forwards;
        }

        .warning{
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 320px;
            background-color: #ffc107;
            min-height: 50px;
            pointer-events: none;
            animation: slideDown 0.35s ease-out, fadeOutContainer 3.5s ease-out forwards;
        }
        .alert-message{
            margin: 0;
            text-align: center;
            font-size: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            width: 100%;
            min-height: 50px;
            line-height: 1.4;
            padding: 12px 16px;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(-15px);
            animation: slideInMessage 0.35s ease-out forwards, fadeOutText 3.5s ease-out forwards;
        }

        .message-success {
            color: white;
            border: 1px solid green;
        }
        .message-error {
            color: white;
            border: 1px solid red;
        }
        .message-warning {
            color: black;
            border: 1px solid #ffc107;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInMessage {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOutText {
            0% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes fadeOutContainer {
            0% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

    </style>
</head>
<body>
    {% include "components/navbar.html" %}
    {% if messages %}
        {% for message in messages %}
            <div class="{{message.tags}}">
                <p class="alert-message message-{{message.tags}}">{{message}}</p>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

    {% include "components/footer.html" %}
</body>
</html>
