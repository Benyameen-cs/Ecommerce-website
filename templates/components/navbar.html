<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header{
            padding: 2% 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo{
            font-family: "playfair";
            font-size: 20px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        nav {
            width: auto;
        }

        nav ul{
            display: flex;
            gap: 20px;
            list-style-type: none;
            align-items: center;
            flex-wrap: wrap;
        }

        nav ul li a{
            text-decoration: none;
            color: white;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            header {
                justify-content: center;
                padding: 1rem;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            nav {
                width: 100%;
            }

            nav ul {
                justify-content: center;
                gap: 12px;
            }

            nav ul li {
                width: auto;
            }
        }

        @media (max-width: 480px) {
            nav ul {
                flex-direction: column;
                gap: 10px;
            }

            nav ul li a {
                display: block;
                padding: 8px 12px;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <a class="logo" href="{% url 'home' %}"><h1>Ecommerce</h1></a>
        <nav>
            <ul>
                <li><a href="{% url 'product_list' %}" >Products</a></li>
                <li><a href="{% url 'category' %}" >Category</a></li>
                <li><a href="{% url 'login' %}" >Login</a></li>
                <li><a href="{% url 'register' %}" >Register</a></li>
                {% if user.is_authenticated %}
                    <li><a href="{% url 'cart' %}" >Cart</a></li>
                    <li><a href="{% url 'profile' %}" >Profile</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>    
</body>
</html>
